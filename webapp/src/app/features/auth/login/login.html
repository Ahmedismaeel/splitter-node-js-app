<div class="container" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="card" style="width: 100%; max-width: 400px;">
    <h2 style="text-align: center; margin-bottom: 24px;">Welcome Back</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="you@example.com">
        <div class="error-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
          Email is required
        </div>
        <div class="error-message" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
          Please enter a valid email
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••">
        <div class="error-message" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Password is required
        </div>
      </div>

      <div class="error-message" *ngIf="error" style="margin-bottom: 16px; text-align: center;">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <div style="margin-top: 16px; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a routerLink="/register">Register</a>
    </div>
  </div>
</div>
